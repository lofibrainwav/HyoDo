# HyoDo agent policy — schema hyodo.policy/v1
# Place as .hyodo/policy.toml in a customer project (or pass --config / --policy).

schema = "hyodo.policy/v1"

# Hard cap on agent step_index (0-based). Exceeding → DENY max_steps.
max_steps = 20

# When set (including empty list), tool_call/tool_result must use a listed name.
# Omit the key entirely to leave tools unrestricted by allowlist.
allowed_tools = ["search", "read_file", "list_dir"]

# Paths declared on tool.paths that match any glob → DENY data_boundary.
blocked_path_globs = [
  "**/.env",
  "**/.env.*",
  "**/secrets/**",
  "**/*credential*",
]

# Optional discretionary web boundary. Uncomment to turn unlisted domains into
# ASK decisions; GET/HEAD are the safe default, and credential-shaped paths are
# denied unless explicitly enabled.
# [web]
# allowed_domains = ["api.example.com", "*.internal.example.com"]
# allow_non_get = false
# allow_credential_paths = false

# Optional operator-controlled trust cap. This does not grant trust by itself;
# use `hyodo policy trust grant --level N` to create untracked local state.
# [trust]
# max_level = 2

# Optional discretionary tool list and annotation threshold.
# ask_tools = ["send_email", "publish_release"]
# ask_threshold = 1
