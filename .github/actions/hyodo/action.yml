name: HyoDo quality gates
description: >-
  Install HyoDo from the same pinned repository ref and run fail-closed quality
  gates (hyodo check). Exits non-zero when gates fail or when nothing measurable
  ran; missing evidence is never reported as green.
author: AFO Kingdom
branding:
  icon: shield
  color: blue
inputs:
  python-version:
    description: Python interpreter version used to run hyodo.
    required: false
    default: "3.12"
  args:
    description: Extra arguments passed to `hyodo check` (e.g. "--general").
    required: false
    default: ""
  upload-sarif:
    description: >-
      Upload the SARIF report to GitHub code scanning. Requires
      `security-events: write` permission on the calling workflow.
    required: false
    default: "false"
runs:
  using: composite
  steps:
    - name: Set up Python
      uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
      with:
        python-version: ${{ inputs.python-version }}
    - name: Install HyoDo from the pinned action ref
      shell: bash
      run: python -m pip install "${{ github.action_path }}/../../.."
    - name: Run HyoDo gates
      shell: bash
      run: hyodo check ${{ inputs.args }}
    - name: Render SARIF report
      if: inputs.upload-sarif == 'true'
      shell: bash
      run: |
        mkdir -p .hyodo/reports
        hyodo report --format sarif --root . --json
    - name: Upload SARIF report
      if: inputs.upload-sarif == 'true'
      uses: github/codeql-action/upload-sarif@6f5948dfacef28e207b48d0905cf90c03365536d # v3
      with:
        sarif_file: .hyodo/reports/hyodo-report.sarif
