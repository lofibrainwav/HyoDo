name: HyoDo quality gates
description: >-
  Install HyoDo from the same pinned repository ref and run fail-closed quality
  gates (hyodo check). Exits non-zero when gates fail or when nothing measurable
  ran; missing evidence is never reported as green.
author: AFO Kingdom
branding:
  icon: shield
  color: blue
inputs:
  python-version:
    description: Python interpreter version used to run hyodo.
    required: false
    default: "3.12"
  args:
    description: Extra arguments passed to `hyodo check` (e.g. "--general").
    required: false
    default: ""
  upload-sarif:
    description: >-
      Upload the SARIF report to GitHub code scanning. Requires
      `security-events: write` permission on the calling workflow.
    required: false
    default: "false"
runs:
  using: composite
  steps:
    - name: Set up Python
      uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
      with:
        python-version: ${{ inputs.python-version }}
    - name: Install HyoDo from the pinned action ref
      shell: bash
      run: python -m pip install "${{ github.action_path }}/../../.."
    - name: Run HyoDo gates
      id: run_gates
      shell: bash
      run: |
        set +e
        hyodo check ${{ inputs.args }} 2>&1 | tee "$RUNNER_TEMP/hyodo-check.log"
        status=${PIPESTATUS[0]}
        set -e
        exit "$status"
    - name: Summarize gate failure
      if: failure() && steps.run_gates.outcome == 'failure'
      shell: bash
      run: |
        summary="${GITHUB_STEP_SUMMARY:-}"
        if [[ -z "$summary" ]]; then
          echo "GitHub step summary is unavailable; gate failure remains failed." >&2
          exit 0
        fi
        {
          echo "## HyoDo quality gate failure"
          echo
          echo "Failure reason: hyodo check exited non-zero."
          echo
          echo "### Gate output"
          echo '```text'
          if [[ -f "$RUNNER_TEMP/hyodo-check.log" ]]; then
            tail -n 80 "$RUNNER_TEMP/hyodo-check.log"
          else
            echo "The gate log was not produced."
          fi
          echo '```'
          echo
          echo "Next action: fix the listed gate failure, then re-run the workflow."
        } >> "$summary"
    - name: Render SARIF report
      if: inputs.upload-sarif == 'true'
      shell: bash
      run: |
        mkdir -p .hyodo/reports
        hyodo report --format sarif --root . --json
    - name: Upload SARIF report
      if: inputs.upload-sarif == 'true'
      id: upload_sarif
      uses: github/codeql-action/upload-sarif@6f5948dfacef28e207b48d0905cf90c03365536d # v3
      with:
        sarif_file: .hyodo/reports/hyodo-report.sarif
    - name: Summarize SARIF upload failure
      if: failure() && steps.upload_sarif.outcome == 'failure'
      shell: bash
      run: |
        summary="${GITHUB_STEP_SUMMARY:-}"
        if [[ -z "$summary" ]]; then
          echo "GitHub step summary is unavailable; SARIF failure remains failed." >&2
          exit 0
        fi
        {
          echo "## HyoDo SARIF upload failure"
          echo
          echo "Failure reason: the SARIF report was missing or GitHub rejected the upload."
          echo "Expected artifact: .hyodo/reports/hyodo-report.sarif"
          echo
          echo "Next action: verify report generation and security-events: write permission."
        } >> "$summary"
