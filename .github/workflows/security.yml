name: Security verification

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# Keep only the newest security run for an active PR; never cancel main evidence.
concurrency:
  group: security-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  secrets:
    name: Historical and working-tree secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # The job name promises history and the working tree. gitleaks-action derived
    # its scope from the triggering event, so a push to main scanned one commit
    # while a manual run scanned the whole history -- the same tree could pass and
    # fail depending on how the run started. These steps pin one contract for
    # every event: the full history, then the working tree, then a check that the
    # baseline cannot hide a secret that is present now.
    env:
      GITLEAKS_IMAGE: ghcr.io/gitleaks/gitleaks@sha256:691af3c7c5a48b16f187ce3446d5f194838f91238f27270ed36eef6359a574d9
    steps:
      - name: Checkout full history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Scan full history
        run: |
          set -euo pipefail
          docker run --rm -v "$PWD:/repo" "$GITLEAKS_IMAGE" \
            detect --source=/repo --redact --no-banner --exit-code 1
      - name: Scan working tree
        if: ${{ !cancelled() }}
        run: |
          set -euo pipefail
          docker run --rm -v "$PWD:/repo" "$GITLEAKS_IMAGE" \
            detect --source=/repo --no-git --redact --no-banner --exit-code 1
      - name: Baseline cannot hide a current secret
        if: ${{ !cancelled() }}
        run: |
          set -euo pipefail
          canary="$(mktemp -d)"
          cp .gitleaksignore "$canary/.gitleaksignore"
          # Built at run time so this file never contains a scannable key itself.
          key="AKIA$(LC_ALL=C tr -dc 'A-Z0-9' </dev/urandom | head -c 16)"
          printf 'aws_access_key_id = %s\n' "$key" > "$canary/planted.txt"
          if docker run --rm -v "$canary:/canary" "$GITLEAKS_IMAGE" \
               detect --source=/canary --no-git --redact --no-banner --exit-code 1; then
            echo "::error::A planted current secret was not reported. The baseline or the rule set is suppressing present-day findings."
            exit 1
          fi
          echo "Planted secret was reported, as required."

  dependencies:
    name: Runtime dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Set up uv
        uses: ./.github/actions/setup-uv-cached
      - name: Verify locked runtime export
        run: |
          uv export --frozen --no-dev --no-editable --no-emit-project \
            --no-hashes --no-annotate --format requirements-txt \
            > /tmp/requirements.runtime.txt
          diff -u requirements.runtime.txt /tmp/requirements.runtime.txt
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install every locked dependency group
        run: uv sync --locked --all-extras --all-groups --no-editable

      - name: Audit all installed locked dependencies
        uses: pypa/gh-action-pip-audit@1220774d901786e6f652ae159f7b6bc8fea6d266 # v1.1.0
        with:
          virtual-environment: .venv/

      - name: Audit the MCP v1 compatibility lock
        uses: pypa/gh-action-pip-audit@1220774d901786e6f652ae159f7b6bc8fea6d266 # v1.1.0
        with:
          inputs: ci/mcp-v1/requirements.txt
          require-hashes: true

  dependency-review:
    name: Pull request dependency review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Review dependency changes
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
