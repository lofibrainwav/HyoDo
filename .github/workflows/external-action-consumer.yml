name: Temporary external HyoDo action consumer

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  external-action:
    runs-on: ubuntu-latest
    steps:
      - name: Check out consumer repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Run released HyoDo composite action externally
        uses: lofibrainwav/HyoDo/.github/actions/hyodo@v4.12.0
        with:
          python-version: "3.12"
          args: "--general"
          upload-sarif: "false"
