name: HyoDo Discoverability Smoke

"on":
  pull_request:
    branches: [main]
    paths:
      - ".pre-commit-hooks.yaml"
      - ".github/actions/hyodo/**"
      - ".github/workflows/discoverability-smoke.yml"
      - "hyodo/report.py"
      - "hyodo/cli/main.py"
      - "tests/test_discoverability_surfaces.py"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pre-commit-consumer:
    name: Pre-commit consumer smoke
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install pre-commit
        run: python -m pip install "pre-commit==4.3.0"

      - name: Run hook from a clean consumer repository
        shell: bash
        run: |
          set -euo pipefail
          consumer="$(mktemp -d)"
          cd "$consumer"
          git init -q
          git config user.email "hyodo-ci@users.noreply.github.com"
          git config user.name "HyoDo CI"
          printf 'print("hello from consumer")\n' > app.py
          git add app.py
          pre-commit try-repo "$GITHUB_WORKSPACE" hyodo-safe-strict --all-files

  composite-action-consumer:
    name: Composite action consumer smoke
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Run local composite action
        uses: ./.github/actions/hyodo
        with:
          args: "--general"
          upload-sarif: "false"
