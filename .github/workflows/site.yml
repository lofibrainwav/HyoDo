name: HyoDo Site Build

"on":
  push:
    branches: [main]
    paths: ["site/**", ".github/workflows/site.yml"]
  pull_request:
    branches: [main]
    paths: ["site/**", ".github/workflows/site.yml"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: site-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  site-build:
    name: Build hyodo.app site
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: site/package-lock.json

      - name: Install dependencies
        working-directory: site
        run: npm ci

      - name: Build
        working-directory: site
        run: npm run build

      - name: Preview and verify evidence graphs
        working-directory: site
        env:
          CHROME_BIN: google-chrome
        run: |
          npm run preview -- --port 4321 &
          preview_pid=$!
          trap 'kill "$preview_pid" 2>/dev/null || true' EXIT
          ready=0
          for attempt in $(seq 1 30); do
            if curl -sf http://localhost:4321/evidence-graph/ > /dev/null; then
              ready=1
              break
            fi
            sleep 1
          done
          test "$ready" = 1
          npm run verify:evidence-graph -- http://localhost:4321 verify-output

      - name: Upload evidence graph screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: evidence-graph-verification
          path: site/verify-output/*.png
