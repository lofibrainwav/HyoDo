name: HyoDo Mutation Evidence

"on":
  schedule:
    - cron: "17 9 * * 1"
  workflow_dispatch:
    inputs:
      scope:
        description: Mutation scope to execute
        required: true
        default: scoring
        type: choice
        options:
          - scoring
          - full
          - both

permissions:
  contents: read

concurrency:
  group: mutation-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  scoring-mutation:
    name: "Mutation Evidence - Scoring (advisory)"
    if: >-
      github.event_name == 'workflow_dispatch' &&
      (inputs.scope == 'scoring' || inputs.scope == 'both')
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Setup Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Set up uv
        uses: ./.github/actions/setup-uv-cached

      - name: Install locked mutation dependencies
        run: |
          uv sync --locked --extra dev --extra mutation
          echo "$GITHUB_WORKSPACE/.venv/bin" >> "$GITHUB_PATH"

      - name: Baseline scoring tests
        run: cosmic-ray baseline cosmic-ray.scoring.toml

      - name: Initialize scoring mutation session
        run: cosmic-ray init cosmic-ray.scoring.toml cosmic-ray-scoring.session

      - name: Execute scoring mutations
        run: cosmic-ray exec cosmic-ray.scoring.toml cosmic-ray-scoring.session

      - name: Build mutation evidence
        if: ${{ always() }}
        run: |
          set -euo pipefail
          cr-report cosmic-ray-scoring.session --no-show-output --no-show-diff > cosmic-ray-scoring-report.txt
          cr-rate --no-estimate cosmic-ray-scoring.session > cosmic-ray-scoring-rate.txt
          cr-xml cosmic-ray-scoring.session > cosmic-ray-scoring.xml
          {
            echo "## Cosmic Ray scoring mutation evidence"
            echo
            echo "This lane is advisory until a measured baseline is reviewed and a threshold is explicitly adopted."
            echo
            echo '```text'
            cat cosmic-ray-scoring-rate.txt
            tail -n 8 cosmic-ray-scoring-report.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload scoring mutation receipt
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: cosmic-ray-scoring-${{ github.sha }}
          path: |
            cosmic-ray-scoring.session
            cosmic-ray-scoring-report.txt
            cosmic-ray-scoring-rate.txt
            cosmic-ray-scoring.xml
          if-no-files-found: error
          retention-days: 14

  full-core-mutation:
    name: "Mutation Evidence - Core Full Run (advisory)"
    if: >-
      github.event_name == 'schedule' ||
      (github.event_name == 'workflow_dispatch' &&
       (inputs.scope == 'full' || inputs.scope == 'both'))
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Setup Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Set up uv
        uses: ./.github/actions/setup-uv-cached

      - name: Install locked mutation dependencies
        run: |
          uv sync --locked --extra dev --extra mutation
          echo "$GITHUB_WORKSPACE/.venv/bin" >> "$GITHUB_PATH"

      - name: Baseline core mutation tests
        run: cosmic-ray baseline cosmic-ray.toml

      - name: Initialize full core mutation session
        run: cosmic-ray init cosmic-ray.toml cosmic-ray-core.session

      - name: Execute full core mutations
        run: cosmic-ray exec cosmic-ray.toml cosmic-ray-core.session

      - name: Build full-core mutation evidence
        if: ${{ always() }}
        run: |
          set -euo pipefail
          cr-report cosmic-ray-core.session --no-show-output --no-show-diff > cosmic-ray-core-report.txt
          cr-rate --no-estimate cosmic-ray-core.session > cosmic-ray-core-rate.txt
          cr-xml cosmic-ray-core.session > cosmic-ray-core.xml
          {
            echo "## Cosmic Ray full-core mutation evidence"
            echo
            echo "Scheduled/manual evidence lane. It does not block releases until a reviewed threshold is adopted."
            echo
            echo '```text'
            cat cosmic-ray-core-rate.txt
            tail -n 8 cosmic-ray-core-report.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload full-core mutation receipt
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: cosmic-ray-core-${{ github.sha }}
          path: |
            cosmic-ray-core.session
            cosmic-ray-core-report.txt
            cosmic-ray-core-rate.txt
            cosmic-ray-core.xml
          if-no-files-found: error
          retention-days: 30
