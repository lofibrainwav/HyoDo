# HyoDo CI/CD Pipeline
# Public package release gates for the hyodo package and CLI.

name: HyoDo CI

"on":
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Least-privilege default token: this workflow only reads the repo.
permissions:
  contents: read

# Cancel superseded runs on feature branches / PRs, but never cancel main
# (main runs are release-gate signal and must complete).
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  actionlint:
    name: "Actionlint - Workflows"
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Install pinned actionlint
        shell: bash
        run: |
          set -euo pipefail
          version="1.7.12"
          archive="actionlint_${version}_linux_amd64.tar.gz"
          url="https://github.com/rhysd/actionlint/releases/download/v${version}/${archive}"
          curl --fail --location --retry 3 --output "$archive" "$url"
          printf '%s  %s\n' \
            "8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8" \
            "$archive" | sha256sum --check
          tar --extract --gzip --file "$archive" actionlint
          install --mode 0755 actionlint "$RUNNER_TEMP/actionlint"

      - name: Check workflow files
        shell: bash
        run: |
          set -euo pipefail
          "$RUNNER_TEMP/actionlint"

  # -------------------------------------------------------------------------
  # Truth Gate - Public package release gate
  # -------------------------------------------------------------------------
  truth-gate:
    name: "Truth Gate - Python ${{ matrix.python-version }}"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Setup Python ${{ matrix.python-version }}
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Set up uv
        uses: ./.github/actions/setup-uv-cached

      - name: Install locked Python dependencies
        run: |
          uv sync --locked --extra dev
          echo "$GITHUB_WORKSPACE/.venv/bin" >> "$GITHUB_PATH"

      - name: Ruff Lint Check - Public Package
        run: |
          echo "Ruff lint check for package, tests, and release scripts..."
          ruff check hyodo tests scripts --output-format=concise
          echo "Repository Ruff lint check passed"

      - name: Ruff Format Check - Public Package
        run: |
          echo "Ruff format check for package, tests, and release scripts..."
          ruff format --check hyodo tests scripts
          echo "Repository Ruff format check passed"

      - name: Pyright Type Check - Public Package
        run: |
          echo "Pyright type check for public package..."
          pyright hyodo
          echo "Public package type check passed"

      - name: Provenance Tests - Every Supported Python
        # The only pytest job runs on one Python; provenance carries a
        # Python 3.10 path (the tomli fallback) that must not go CI-blind.
        run: |
          pytest tests/test_measurement_provenance.py -q

      - name: Validate JSON
        run: |
          set -euo pipefail
          echo "Validating plugin.json..."
          jq . .claude-plugin/plugin.json > /dev/null
          echo "plugin.json is valid"
          echo "Validating marketplace.json..."
          jq . .claude-plugin/marketplace.json > /dev/null
          echo "marketplace.json is valid"

      - name: Validate YAML
        run: |
          echo "Validating workflow files..."
          python3 - <<'PY'
          import yaml
          for path in [
              '.github/workflows/ci.yml',
              '.github/workflows/smoke.yml',
              '.github/workflows/publish.yml',
          ]:
              with open(path, encoding='utf-8') as f:
                  yaml.safe_load(f)
              print(f'{path} is valid')
          PY

      - name: Check release surface files exist
        run: |
          echo "Release surface files check..."
          required_files=(
            "install_interactive.sh"
            ".env.minimal"
            "QUICK_START.md"
            "VERSION"
            "scripts/verify-public.sh"
            "scripts/release/check_version_sync.py"
            "RELEASE_CHECKLIST.md"
          )
          for file in "${required_files[@]}"; do
            if [ -f "$file" ]; then
              echo "Found: $file"
            else
              echo "Missing required release file: $file"
              exit 1
            fi
          done
          python scripts/release/check_version_sync.py

  # -------------------------------------------------------------------------
  # Truth Gate (MCP SDK v1) - the optional adapter must work on both majors
  #
  # hyodo._mcp_compat supports mcp 1.x (fastmcp.FastMCP) and 2.x
  # (mcpserver.MCPServer). The dev extra resolves to 2.x; this job pins 1.x so
  # the older line stays exercised after the range widened to <3.
  # -------------------------------------------------------------------------
  truth-gate-mcp-v1:
    name: "Truth Gate - Python 3.12, MCP SDK v1"
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Setup Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Set up uv
        uses: ./.github/actions/setup-uv-cached
        with:
          cache_dependency_glob: |
            uv.lock
            pyproject.toml
            ci/mcp-v1/requirements.txt

      - name: Install locked dependencies and exercise MCP SDK v1
        run: |
          uv venv --python 3.12 .venv
          uv pip install --python .venv/bin/python \
            --require-hashes -r ci/mcp-v1/requirements.txt
          echo "$GITHUB_WORKSPACE/.venv/bin" >> "$GITHUB_PATH"

      - name: Run MCP adapter tests on SDK v1
        run: |
          python -m pytest tests/test_mcp_stdio.py -q --tb=short

  # -------------------------------------------------------------------------
  # Goodness Gate - Safety and package smoke tests
  # -------------------------------------------------------------------------
  goodness-public-tests:
    name: "Goodness - Public Package Tests"
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Set up uv
        uses: ./.github/actions/setup-uv-cached

      - name: Install locked Python dependencies
        run: |
          uv sync --locked --extra dev
          echo "$GITHUB_WORKSPACE/.venv/bin" >> "$GITHUB_PATH"

      - name: Run Public Package Smoke Tests
        run: |
          echo "Running public package smoke checks..."
          EXPECTED="$(tr -d '[:space:]' < VERSION)"
          python - <<PY
          import hyodo
          from hyodo import calculate_hygook_v5_score, calculate_trinity_score, is_strong_review_signal

          assert hyodo.__version__ == "${EXPECTED}"
          f_score, s_score = calculate_hygook_v5_score(1, 1, 1, 1, 1)
          assert round(f_score, 2) == 60.00
          assert round(s_score, 2) == 10.00
          assert calculate_trinity_score(1, 1, 1, benevolence=1, loyalty=1) == 100
          assert is_strong_review_signal(95, 5) is True
          print('public package smoke checks passed', hyodo.__version__)
          PY

      - name: Run Public Package Tests (release blocker)
        env:
          HYODO_SBOM_INTEGRATION: "1"
          # sys.monitoring-based line coverage (Python 3.12+). Same measured
          # lines and total as the default tracer, with less per-line overhead.
          COVERAGE_CORE: sysmon
        run: |
          echo "Running public package tests (blocking)..."
          python -m pytest tests -q --tb=short -n auto --cov=hyodo --cov-fail-under=80

  hostile-clone-gauntlet:
    name: "Goodness - Hostile Clone Gauntlet"
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Set up uv
        uses: ./.github/actions/setup-uv-cached

      - name: Install locked Python dependencies
        run: |
          uv sync --locked --extra dev
          echo "$GITHUB_WORKSPACE/.venv/bin" >> "$GITHUB_PATH"

      - name: Build wheel
        run: python -m build --wheel

      - name: Attack the built wheel with a hostile clone (release blocker)
        run: bash scripts/release/hostile_clone_gauntlet.sh dist/*.whl

  goodness-orchestration:
    name: "Goodness - CLI Orchestration"
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Set up uv
        uses: ./.github/actions/setup-uv-cached

      - name: Install locked Python dependencies
        run: |
          uv sync --locked --extra dev
          echo "$GITHUB_WORKSPACE/.venv/bin" >> "$GITHUB_PATH"

      - name: Full `hyodo check` orchestration (release blocker)
        # Prove the advertised CLI integration contract end-to-end at the repo
        # root: all four gates orchestrate to exit 0 with Eternity actually
        # PASSing (not SKIP). The individual tools are checked elsewhere; this is
        # the one-shot orchestration proof the other jobs do not cover.
        run: |
          set +e
          out="$(hyodo check 2>&1)"
          ec=$?
          set -euo pipefail
          echo "$out"
          test "$ec" -eq 0
          echo "$out" | grep -q "All executed gates passed"
          echo "$out" | grep -q "SBOM generated (public surface)"

  goodness-safety-fixtures:
    name: "Goodness - Safety Fixtures"
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Set up uv
        uses: ./.github/actions/setup-uv-cached

      - name: Install locked Python dependencies
        run: |
          uv sync --locked --extra dev
          echo "$GITHUB_WORKSPACE/.venv/bin" >> "$GITHUB_PATH"

      - name: Safe --strict high-risk fixture (release blocker)
        run: |
          printf 'token = ghp_abcdefghijklmnopqrstuvwxyz012345\n' > /tmp/hyodo-ci-secret.txt
          set +e
          hyodo safe --strict /tmp/hyodo-ci-secret.txt
          ec=$?
          set -e
          test "$ec" -eq 1

      - name: Security Scan
        run: |
          echo "Safety gate check..."
          if grep -r "rm -rf /" . --include="*.sh" 2>/dev/null; then
            echo "Dangerous command detected!"
            exit 1
          fi
          echo "Safety check passed"

      - name: Check Environment Files
        run: |
          test -f ".env.example"
          test -f ".env.minimal"
          echo "Environment template files exist"

  goodness-gate:
    name: "Goodness Gate - Safety"
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs:
      [goodness-public-tests, goodness-orchestration, goodness-safety-fixtures, hostile-clone-gauntlet]
    if: ${{ always() }}

    steps:
      - name: Verify all safety lanes succeeded
        env:
          PUBLIC_TESTS_RESULT: ${{ needs['goodness-public-tests'].result }}
          ORCHESTRATION_RESULT: ${{ needs['goodness-orchestration'].result }}
          SAFETY_FIXTURES_RESULT: ${{ needs['goodness-safety-fixtures'].result }}
          GAUNTLET_RESULT: ${{ needs['hostile-clone-gauntlet'].result }}
        run: |
          set -euo pipefail

          check_success() {
            name="$1"
            result="$2"
            if [ "$result" != "success" ]; then
              echo "::error::$name did not succeed (result=$result)"
              exit 1
            fi
          }

          check_success "Public package tests" "$PUBLIC_TESTS_RESULT"
          check_success "CLI orchestration" "$ORCHESTRATION_RESULT"
          check_success "Safety fixtures" "$SAFETY_FIXTURES_RESULT"
          check_success "Hostile clone gauntlet" "$GAUNTLET_RESULT"
          echo "All Goodness safety lanes succeeded."

  # -------------------------------------------------------------------------
  # Public language - commit and PR text
  #
  # tests/test_public_language.py covers tracked files. It cannot see commit
  # messages or PR text, and those are just as public. This job closes that half.
  # Only the commits this PR adds are checked, so history stays untouched.
  # -------------------------------------------------------------------------
  public-language:
    name: "Public language - commit and PR text"
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: github.event_name == 'pull_request' || github.event_name == 'push'

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Commit messages, PR title and body are English
        env:
          BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.sha }}
          # Values arrive through env, never interpolated into the script body.
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import importlib.util
          import os
          import subprocess
          import sys

          # Call the same predicate the tracked-file test uses, so files and
          # commit/PR text are judged by one implementation. An earlier copy here
          # rebuilt the rule from the allowed syllables and kept the weaker rule
          # after the file gate was tightened.
          spec = importlib.util.spec_from_file_location(
              "public_language", "tests/test_public_language.py"
          )
          module = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(module)
          offending = module.find_public_language_offenses

          failures = []

          revs = subprocess.run(
              ["git", "rev-list", f"{os.environ['BASE_SHA']}..{os.environ['HEAD_SHA']}"],
              capture_output=True, text=True, check=True,
          ).stdout.split()
          for sha in revs:
              body = subprocess.run(
                  ["git", "log", "-1", "--format=%B", sha],
                  capture_output=True, text=True, check=True,
              ).stdout
              found = offending(body)
              if found:
                  subject = body.splitlines()[0] if body.splitlines() else ""
                  failures.append(f"commit {sha[:8]} {subject!r} contains {found}")

          for label, value in (("PR title", os.environ.get("PR_TITLE")),
                               ("PR body", os.environ.get("PR_BODY"))):
              found = offending(value)
              if found:
                  failures.append(f"{label} contains {found}")

          if failures:
              print("::error::Commit and PR text in this repository are English "
                    "(CLAUDE.md). Korean is allowed only as the six trilingual "
                    "virtue labels.")
              for line in failures:
                  print(f"  {line}")
              sys.exit(1)

          print(f"Commit messages ({len(revs)}), PR title and body: English only - OK")
          PY

  # -------------------------------------------------------------------------
  # Beauty Gate - Documentation and Structure
  # -------------------------------------------------------------------------
  beauty-gate:
    name: "Beauty Gate - Docs"
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "22"

      - name: Install markdownlint
        run: npm ci --prefix site

      - name: Lint Public Entry Documentation
        run: |
          site/node_modules/.bin/markdownlint README.md QUICK_START.md CONTRIBUTING.md AGENTS.md ROADMAP.md PHILOSOPHY.md docs/README.md
          echo "Public entry documentation lint passed"

      - name: Check Required Files
        run: |
          echo "Required files check..."
          required_files=(
            "README.md"
            "QUICK_START.md"
            "CONTRIBUTING.md"
            "CHANGELOG.md"
            "LICENSE"
            "SECURITY.md"
            "RELEASE_CHECKLIST.md"
            "pyproject.toml"
          )
          for file in "${required_files[@]}"; do
            if [ -f "$file" ]; then
              echo "Found: $file"
            else
              echo "Missing required file: $file"
              exit 1
            fi
          done

      - name: Check documentation and version consistency
        run: |
          VERSION="$(tr -d '[:space:]' < VERSION)"
          grep -q "$VERSION" CHANGELOG.md
          grep -q "HyoDo Integrity Score" README.md
          grep -q "advisory only" README.md
          grep -q "legacy" PHILOSOPHY.md
          grep -q "replacement is being updated" CONTRIBUTING.md
          grep -q "Release readiness" RELEASE_CHECKLIST.md
          echo "Documentation consistency verified for $VERSION"

      - name: Public docs external-first regression guard
        run: |
          set -o pipefail
          echo "Public docs external-first regression guard..."
          fail=0
          DOCS=(README.md QUICK_START.md SECURITY.md)
          PUBLIC_SURFACES=("${DOCS[@]}" CONTRIBUTING.md RELEASE_CHECKLIST.md hyodo/cli/main.py)
          # 1. Unevidenced cost claim: "Saves 50-70%" badge/text
          if grep -rEn "Saves[ _-]?50[-–]?70|badge/Saves.*50.*70" "${DOCS[@]}" 2>/dev/null; then
            echo "::error::Banned: 'Saves 50-70%' cost claim (unevidenced). Use softened wording like 'designed to reduce unnecessary expensive-model usage'."
            fail=1
          fi
          # 2. Automation overclaim: auto-approve language on public surfaces
          if grep -rEn "Auto-approve|AUTO_RUN" "${PUBLIC_SURFACES[@]}" 2>/dev/null; then
            echo "::error::Banned: auto-approve / AUTO_RUN phrasing on public surfaces. Scores support review, not replace it."
            fail=1
          fi
          # 3. HYOGOOK/Hanja must not lead README (top 15 lines) — practical value first
          if head -15 README.md | grep -En "HYOGOOK|五德|[仁眞善忠美永孝]"; then
            echo "::error::Banned: HYOGOOK/Hanja in README top-15 lines. Lead with practical value; keep philosophy below usage."
            fail=1
          fi
          # 4. Keep one canonical root license. A second LICENSE-like file is
          # rendered by GitHub as another detected license.
          if [ -e LICENSE.md ]; then
            echo "::error::Redundant LICENSE.md found. Keep LICENSE as the single canonical license."
            fail=1
          fi
          # 5. README is a product entry point, not the full documentation set.
          readme_lines="$(wc -l < README.md | tr -d '[:space:]')"
          if [ "$readme_lines" -gt 180 ]; then
            echo "::error::README.md is $readme_lines lines; keep it at or below 180 and move detail to docs/."
            fail=1
          fi
          if [ "$fail" = "1" ]; then
            echo "Public docs external-first regression guard FAILED (BIG-188 policy)"
            exit 1
          fi
          echo "Public docs external-first regression guard passed"

  # -------------------------------------------------------------------------
  # Eternity - public-surface SBOM (advisory: observe first, never blocks)
  # -------------------------------------------------------------------------
  sbom:
    name: "Eternity - Public SBOM"
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Advisory-first: generating the SBOM must not block the release gate yet.
    continue-on-error: true

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Set up uv
        uses: ./.github/actions/setup-uv-cached

      - name: Install locked Python dependencies (including cyclonedx-bom)
        run: |
          uv sync --locked --extra dev
          echo "$GITHUB_WORKSPACE/.venv/bin" >> "$GITHUB_PATH"

      - name: Generate public-surface SBOM
        # Builds the public wheel, installs it into a clean venv, and inventories
        # that env — so only typer/rich + transitive appear (self-scope-checked).
        run: python scripts/generate_sbom.py -o dist/sbom.cyclonedx.json

      - name: Verify SBOM scope + reproducibility (real pipeline)
        # Exercises the real build/venv/inventory path twice and asserts scope
        # (no dev/bootstrap leak) and reproducibility — the default suite mocks it.
        env:
          HYODO_SBOM_INTEGRATION: "1"
        run: python -m pytest tests/test_sbom.py -q -k end_to_end

      - name: Upload SBOM artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: hyodo-sbom-cyclonedx
          path: dist/sbom.cyclonedx.json
          if-no-files-found: error
          retention-days: 14

  # -------------------------------------------------------------------------
  # Final HyoDo Integrity Score Release Readiness
  # -------------------------------------------------------------------------
  trinity-score:
    name: "HyoDo Integrity Score"
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: [truth-gate, truth-gate-mcp-v1, goodness-gate, beauty-gate, public-language]
    if: ${{ always() }}

    steps:
      - name: Verify required upstream jobs
        env:
          EVENT_NAME: ${{ github.event_name }}
          TRUTH_RESULT: ${{ needs['truth-gate'].result }}
          MCP_V1_RESULT: ${{ needs['truth-gate-mcp-v1'].result }}
          GOODNESS_RESULT: ${{ needs['goodness-gate'].result }}
          BEAUTY_RESULT: ${{ needs['beauty-gate'].result }}
          PUBLIC_LANGUAGE_RESULT: ${{ needs['public-language'].result }}
        run: |
          set -euo pipefail

          check_success() {
            name="$1"
            result="$2"
            if [ "$result" != "success" ]; then
              echo "::error::$name did not succeed (result=$result)"
              exit 1
            fi
          }

          check_success "Truth Gate matrix" "$TRUTH_RESULT"
          check_success "MCP SDK v1 gate" "$MCP_V1_RESULT"
          check_success "Goodness Gate" "$GOODNESS_RESULT"
          check_success "Beauty Gate" "$BEAUTY_RESULT"

          if [ "$EVENT_NAME" = "pull_request" ]; then
            check_success "Public language gate" "$PUBLIC_LANGUAGE_RESULT"
          elif [ "$PUBLIC_LANGUAGE_RESULT" != "skipped" ] && \
               [ "$PUBLIC_LANGUAGE_RESULT" != "success" ]; then
            echo "::error::Public language gate had unexpected result=$PUBLIC_LANGUAGE_RESULT"
            exit 1
          fi

          echo "All required upstream jobs succeeded."

      - name: Validate HyoDo public release readiness
        run: |
          echo "============================================"
          echo "     HyoDo Public Release Readiness"
          echo "     Scores are advisory; required release gates determine readiness"
          echo "============================================"
          echo ""
          echo "Public OSS Release readiness (see VERSION)"
          echo ""
          echo "Validated release blockers:"
          echo "  - Python 3.10-3.14 lint/type/package checks"
          echo "  - MCP SDK v1 compatibility"
          echo "  - Public package tests and CLI orchestration"
          echo "  - Documentation lint and external-first guards"
          echo "  - PR public-language check when applicable"
          echo "  - Required release files present"
          echo ""
          echo "Advisory checks:"
          echo "  - Public-surface SBOM remains advisory"
          echo ""
          echo "============================================"
          echo "     Status: READY_FOR_RELEASE_REVIEW"
          echo "============================================"

      - name: Record Release Readiness
        run: |
          echo "Release readiness: READY_FOR_RELEASE_REVIEW (not score or authority)"
