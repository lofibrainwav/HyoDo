# Publish HyoDo to PyPI via Trusted Publishing (OIDC) only.
# No long-lived API token. Requires:
#   1) GitHub Environment `pypi` (optional approval / protection)
#   2) PyPI Trusted Publisher: owner=lofibrainwav repo=HyoDo
#      workflow=publish.yml environment=pypi
#
# Primary trigger: publishing a GitHub Release after durable SBOM evidence is
# attached to its draft. Manual dispatch is recovery-only and enforces the same
# published-release evidence gate.

name: Publish to PyPI

"on":
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing published and verified release tag, e.g. v4.12.0
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: pypi-publish-${{ github.event.release.tag_name || inputs.tag || github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build release artifacts
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.meta.outputs.version }}
      tag: ${{ steps.meta.outputs.tag }}
      commit: ${{ steps.meta.outputs.commit }}
    steps:
      - name: Resolve tag ref
        id: ref
        env:
          INPUT_TAG: ${{ inputs.tag }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            TAG="$INPUT_TAG"
          elif [ "$EVENT_NAME" = "release" ]; then
            TAG="$RELEASE_TAG"
          else
            echo "Unsupported publish event: $EVENT_NAME"
            exit 1
          fi
          case "$TAG" in
            v[0-9]*.[0-9]*.[0-9]*) ;;
            *)
              echo "Tag must look like vX.Y.Z, got: $TAG"
              exit 1
              ;;
          esac
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Checkout tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ steps.ref.outputs.tag }}
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Validate tag / VERSION / main ancestry / tag trust
        id: meta
        env:
          TAG: ${{ steps.ref.outputs.tag }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          VERSION="$(tr -d '[:space:]' < VERSION)"
          EXPECTED="v${VERSION}"
          if [ "$TAG" != "$EXPECTED" ]; then
            echo "Tag/VERSION mismatch: tag=$TAG VERSION=$VERSION (expected $EXPECTED)"
            exit 1
          fi
          python scripts/release/check_version_sync.py
          COMMIT="$(git rev-parse HEAD)"
          git fetch origin main --depth=200
          if ! git merge-base --is-ancestor "$COMMIT" origin/main; then
            echo "Tagged commit $COMMIT is not an ancestor of origin/main"
            exit 1
          fi
          python scripts/release/verify_git_tag.py \
            --repository "$GITHUB_REPOSITORY" \
            --tag "$TAG" \
            --expected-commit "$COMMIT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "commit=$COMMIT" >> "$GITHUB_OUTPUT"
          echo "Publishing verified candidate: $TAG @ $COMMIT"

      - name: Verify published durable Release evidence
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.ref.outputs.tag }}
        run: |
          set -euo pipefail
          IS_DRAFT="$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json isDraft --jq '.isDraft')"
          if [ "$IS_DRAFT" != "false" ]; then
            echo "ERROR: PyPI publication requires a published GitHub Release"
            exit 1
          fi
          ASSETS="$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name')"
          grep -Fx "sbom.cyclonedx.json" <<<"$ASSETS"
          grep -Fx "sbom.cyclonedx.json.sha256" <<<"$ASSETS"
          rm -rf release-evidence
          mkdir release-evidence
          gh release download "$TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --pattern "sbom.cyclonedx.json*" \
            --dir release-evidence
          test -f release-evidence/sbom.cyclonedx.json
          test -f release-evidence/sbom.cyclonedx.json.sha256
          cd release-evidence
          sha256sum -c sbom.cyclonedx.json.sha256

      - name: Install build tooling
        run: |
          python -m pip install --upgrade pip
          pip install --upgrade build "twine>=7"

      - name: Build sdist and wheel
        run: python -m build

      - name: Twine check
        run: python -m twine check dist/*

      - name: Guard sdist (no afo_core)
        run: |
          python - <<'PY'
          import tarfile
          from pathlib import Path
          sdist = next(Path("dist").glob("*.tar.gz"))
          with tarfile.open(sdist) as t:
              names = t.getnames()
          bad = [n for n in names if "/afo_core/" in n or n.endswith("/afo_core")]
          assert not bad, f"sdist includes afo_core: {bad[:5]}"
          assert sdist.stat().st_size < 500_000, sdist.stat().st_size
          print(f"sdist clean: {sdist.name} {sdist.stat().st_size} bytes")
          PY

      - name: Upload dist artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: python-package-distributions
          path: dist/
          if-no-files-found: error
          retention-days: 14

  publish:
    name: Publish to PyPI (OIDC)
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/hyodo
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Download dist artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: python-package-distributions
          path: dist/

      - name: Publish package distributions to PyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          verbose: true
          print-hash: true

  verify:
    name: Post-publish readback
    needs: [build, publish]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout scripts
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.build.outputs.tag }}

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Wait for PyPI index + verify provenance / install
        env:
          EXPECTED_VERSION: ${{ needs.build.outputs.version }}
          EXPECTED_COMMIT: ${{ needs.build.outputs.commit }}
        run: |
          python scripts/release/verify-pypi-release.py \
            --version "$EXPECTED_VERSION" \
            --require-provenance \
            --install-smoke \
            --retries 24 \
            --provenance-retries 30 \
            --sleep-seconds 10
