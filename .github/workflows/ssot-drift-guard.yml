name: SSOT drift guard

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  orchestration-contract:
    name: Reject stale derived-map claims
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Verify orchestration contract
        run: python scripts/check_orchestration_contract.py
      - name: Verify HyoDo/KINGDOM boundary
        run: python scripts/check_hyodo_boundary.py
