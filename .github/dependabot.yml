# Dependabot configuration for HyoDo
# Public product surface is root pyproject.toml.

version: 2
updates:
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "public-surface"
    commit-message:
      prefix: "deps"
      include: "scope"

  - package-ecosystem: "pip"
    directory: "/ci/mcp-v1"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 3
    labels:
      - "dependencies"
      - "ci"
    ignore:
      - dependency-name: "mcp"
        versions: [">=2"]
      # pydantic pins pydantic-core exactly, so the group below matches the
      # name but cannot resolve a release of core alone: dependabot still
      # opens a PR whenever only pydantic-core moves, and the hashed lock is
      # then unsatisfiable (PR #342, PR #360). Let pydantic carry it.
      - dependency-name: "pydantic-core"
    groups:
      # pydantic pins pydantic-core to an exact version, so a lone bump of
      # either half makes the hashed lock unresolvable (see PR #342).
      pydantic:
        patterns:
          - "pydantic"
          - "pydantic-core"
          - "pydantic-settings"
    commit-message:
      prefix: "ci-deps"
      include: "scope"

  - package-ecosystem: "npm"
    directory: "/site"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "site"
    commit-message:
      prefix: "deps"
      include: "scope"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    cooldown:
      default-days: 7
    labels:
      - "dependencies"
      - "ci"
    commit-message:
      prefix: "ci"
      include: "scope"
