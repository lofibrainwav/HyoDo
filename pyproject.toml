[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "hyodo"
version = "4.11.0"
description = "Honest local guardrails for AI-assisted development: evidence, policy checks, and fail-closed quality gates"
readme = "README.md"
license = "MIT"
authors = [
    { name = "AFO Kingdom" }
]
keywords = [
    "ai",
    "code-quality",
    "claude",
    "model-agnostic",
    "codex",
    "grok",
    "gemini",
    "claude-code",
    "automation",
    "trinity-score",
    "hygook-v5",
    "llm",
    "cli",
    "code-review"
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Quality Assurance",
    "Topic :: Software Development :: Testing",
    "Topic :: Utilities",
]
requires-python = ">=3.10"
dependencies = [
    "jsonschema>=4.18,<5",
    # hyodo.schema catches referencing.exceptions.Unresolvable directly, so this is a
    # direct dependency even though jsonschema>=4.18 already pulls it in. Declare what
    # you import: relying on someone else's transitive dep breaks at import time if
    # they ever drop it.
    "referencing>=0.28.4",
    "typer>=0.9.0",
    "rich>=13.0.0",
    # hyodo.gates (Bring-Your-Own-Gates) parses .hyodo/gates.toml with stdlib
    # tomllib (3.11+). Python 3.10 checkouts need the tomli backport -- it is
    # a base dependency, not dev-only, because hyodo.cli.main imports
    # hyodo.gates unconditionally at CLI startup.
    "tomli>=1.2.0; python_version < \"3.11\"",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=4.0",
    "hypothesis>=6.0",
    "ruff>=0.4",
    "pyright>=1.1",
    "build>=1.2",
    # twine <7 cannot parse Metadata-Version 2.5 sdis that current hatchling
    # emits; `twine check dist/*` then fails on a perfectly valid distribution.
    "twine>=7.0",
    "PyYAML>=6.0",
    # Both SDK majors are supported (hyodo._mcp_compat); v1 fastmcp and v2
    # MCPServer are exercised by CI on separate pins.
    "mcp>=1.27,<3",
    # Capped: generate_sbom.py depends on the `environment` CLI surface
    # (--output-reproducible, --pyproject, --mc-type); re-validate before a major bump.
    "cyclonedx-bom>=7.0,<9",
]
mcp = [
    "mcp>=1.27,<3",
]
mutation = [
    # Receipt semantics and status codes are version-sensitive; keep these exact
    # until the mutation parser and configs are revalidated against an upgrade.
    "mutmut==3.7.0",
    "cosmic-ray==8.7.0",
]

[project.scripts]
hyodo = "hyodo.cli.main:app"

[project.urls]
Homepage = "https://github.com/lofibrainwav/HyoDo"
Documentation = "https://github.com/lofibrainwav/HyoDo#readme"
Repository = "https://github.com/lofibrainwav/HyoDo"
Issues = "https://github.com/lofibrainwav/HyoDo/issues"
Changelog = "https://github.com/lofibrainwav/HyoDo/blob/main/CHANGELOG.md"
Security = "https://github.com/lofibrainwav/HyoDo/blob/main/SECURITY.md"

[tool.hatch.build.targets.wheel]
packages = ["hyodo"]

# Public sdist must NOT ship afo_core (advisory tree) or repo tooling noise.
[tool.hatch.build.targets.sdist]
only-include = [
  "hyodo",
  "tests",
  "README.md",
  "LICENSE",
  "CHANGELOG.md",
  "VERSION",
  "pyproject.toml",
  "SECURITY.md",
  "CONTRIBUTING.md",
  "CODE_OF_CONDUCT.md",
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B", "C4", "SIM", "PT", "RUF"]
# RUF001/RUF002: intentional typography (× multiplication sign, – en dash) in
# docstrings and user-facing strings; converting them would change output.
# E501: line length is governed by the formatter.
ignore = ["E501", "RUF001", "RUF002"]

[tool.pyright]
pythonVersion = "3.10"
typeCheckingMode = "standard"

[tool.pytest.ini_options]
asyncio_mode = "auto"
# Public package tests only. afo_core tests are advisory (run explicitly if needed).
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short"
markers = [
    "unit: Unit tests (fast, isolated)",
    "integration: Integration tests (DB, API)",
    "e2e: End-to-end tests (slow)",
    "slow: Slow tests",
    "skip_ci: Skip in CI",
]

[tool.coverage.run]
source = ["hyodo"]
omit = [
    "*/tests/*",
    "*/__pycache__/*",
    "*/scripts/*",
]

[tool.coverage.report]
# Measured baseline is ~90% after the Sprint 1 contract tests; gate at 80% to
# leave headroom while still catching regressions. The gate is only meaningful
# because CI now passes --cov (goodness-gate), not the pyproject value alone.
fail_under = 80
show_missing = true
skip_covered = false
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "if __name__ == .__main__.:",
    "raise NotImplementedError",
    "def __repr__",
]

# Mutation testing configuration (mutmut 3.7.0).
# Run in an isolated checkout: mutmut run
[tool.mutmut]
source_paths = ["hyodo/__init__.py", "hyodo/safety.py", "hyodo/events.py", "hyodo/exceptions.py"]
pytest_add_cli_args_test_selection = [
    "tests/test_scoring_math.py",
    "tests/test_scoring_properties.py",
    "tests/test_safety_patterns.py",
    "tests/test_safety_property_boundaries.py",
    "tests/test_ledger_durability.py",
]
